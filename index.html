<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>qym1421</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <!-- 控制栏：语言 + 风格 -->
        <div class="control-bar">
            <div class="lang-group">
                <span class="label">语言</span>
                <button class="lang-btn active" data-lang="zh">中文</button>
                <button class="lang-btn" data-lang="en">English</button>
            </div>
            <div class="style-group">
                <span class="label">风格</span>
                <button class="style-btn active" data-theme="light">正常</button>
                <button class="style-btn" data-theme="dark">暗黑</button>
            </div>
        </div>

        <!-- 中文首页 -->
        <div id="home-zh" class="content active">
            <header>
                <h1 id="zh-title">qym1421</h1>
                <p id="zh-sub" class="sub">—— 随便写点什么 ——</p>
            </header>

            <section class="home-body">
                <p>这里是 Qiuym 的用户首页。</p>
                <p>当前没什么可看的，但如果你迷路了——</p>
                <p style="margin-top: 1.5rem;">
                    <a href="tutorial/" class="home-link">→ 去联机指南 ←</a>
                </p>
                <p style="margin-top: 0.5rem; font-size: 0.9rem; color: var(--text-muted);">
                    或者直接去 <a href="https://github.com/qym1421" target="_blank">GitHub</a>
                </p>
            </section>

            <footer>
                <p id="zh-footer">— 完 —</p>
            </footer>
        </div>

        <!-- 英文首页 -->
        <div id="home-en" class="content">
            <header>
                <h1 id="en-title">qym1421</h1>
                <p id="en-sub" class="sub">—— just some placeholder ——</p>
            </header>

            <section class="home-body">
                <p>This is Qiuym's user homepage.</p>
                <p>Nothing much here yet, but if you're lost—</p>
                <p style="margin-top: 1.5rem;">
                    <a href="tutorial/" class="home-link">→ Go to Tutorial ←</a>
                </p>
                <p style="margin-top: 0.5rem; font-size: 0.9rem; color: var(--text-muted);">
                    or head to <a href="https://github.com/qym1421" target="_blank">GitHub</a>
                </p>
            </section>

            <footer>
                <p id="en-footer">— End —</p>
            </footer>
        </div>
    </div>

    <script>
        (function() {
            // ---- 语言切换 ----
            const langBtns = document.querySelectorAll('.lang-btn');
            const zh = document.getElementById('home-zh');
            const en = document.getElementById('home-en');

            function setLang(lang) {
                langBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === lang);
                });
                zh.classList.toggle('active', lang === 'zh');
                en.classList.toggle('active', lang === 'en');
            }

            langBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    setLang(this.dataset.lang);
                });
            });

            // ---- 风格切换 ----
            const styleBtns = document.querySelectorAll('.style-btn');
            const app = document.getElementById('app');

            function setTheme(theme) {
                styleBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === theme);
                });
                app.classList.toggle('theme-dark', theme === 'dark');
            }

            styleBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    setTheme(this.dataset.theme);
                });
            });

            // ---- 初始化 ----
            setTheme('light');
        })();
    </script>
</body>
</html>
